name: smart_health_tracker
description: A professional Flutter Smart Health Tracker app with Firebase backend.
repository: https://github.com/ramysaid200/Smart-Health-tracker-app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Local Storage
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # UI & Theming
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.69.0

  # Images
  cached_network_image: ^3.4.1

  # Date & Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
